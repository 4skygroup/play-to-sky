# ── Non-www → www canonical redirect (301) ──────────────────────────────────
server {
    listen 80;
    server_name playtosky.com;
    return 301 https://www.playtosky.com$request_uri;
}

# ── Main server ───────────────────────────────────────────────────────────────
# SSL termination is typically handled upstream (CDN / load balancer).
# To enable direct TLS: change listen to "443 ssl", uncomment ssl_* lines,
# and add a port-80 redirect block: return 301 https://$host$request_uri;
server {
    listen 80;
    server_name www.playtosky.com _;
    root /usr/share/nginx/html;
    index index.html;

    # ── HSTS — uncomment once SSL is active ─────────────────────────────────
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── SSL (uncomment when terminating TLS at nginx) ────────────────────────
    # ssl_certificate     /etc/ssl/certs/playtosky.crt;
    # ssl_certificate_key /etc/ssl/private/playtosky.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block"                   always;

    # ── React Router SPA: all routes → index.html ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static assets: long-term cache ───────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|otf|ttf|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SEO files: short cache ────────────────────────────────────────────────
    location ~* \.(xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }
}
